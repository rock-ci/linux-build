name: build

on:
  workflow_call:
    inputs:
      linux_repo:
        description: Linux Git repository to use
        type: string
        required: false
      linux_ref:
        description: Linux Git ref to use
        type: string
        required: false
      linux_arch:
        description: Linux ARCH to use
        type: string
        required: false
      linux_config:
        description: Linux config set to use
        type: string
        required: false
  workflow_dispatch:
    inputs:
      linux_repo:
        description: Linux Git repository to use
        type: string
        required: false
      linux_ref:
        description: Linux Git ref to use
        type: string
        required: false
      linux_arch:
        description: Linux ARCH to use
        type: string
        required: false
      linux_config:
        description: Linux config set to use
        type: string
        required: false

jobs:
  build:
    runs-on: ubuntu-24.04
    container: ghcr.io/sigmaris/aarch64-linux-crossbuilder:trixie
    env:
      LINUX_REPO_WD: "${{ inputs.linux_repo }}"
      LINUX_REF_WD: "${{ inputs.linux_ref }}"
      LINUX_ARCH_WD: "${{ inputs.linux_arch }}"
      LINUX_CONFIG_WD: "${{ inputs.linux_config }}"
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out this repo
        uses: actions/checkout@v7

      - id: resolve_vars
        name: Resolve variables
        run: scripts/resolve_vars.sh

      - id: get_remote_commit
        name: Get commit on remote branch
        run: |
          remote_commit=$(git ls-remote --heads '${{ steps.resolve_vars.outputs.linux_repo }}' '${{ steps.resolve_vars.outputs.linux_ref }}' | awk '{print $1}')
          echo "Remote commit: $remote_commit"
          printf 'remote_commit=%s\n' "$remote_commit" > "$GITHUB_OUTPUT"

      - id: get_last_metadata
        name: Get previous run metadata
        uses: actions/github-script@v9
        with:
          script: |
            const thisRun = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId
            });
            console.log("This workflow run:", thisRun);

            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: thisRun.workflow_id,
              status: "success",
              per_page: 1,
              exclude_pull_requests: true
            });

            if (runs.data.total_count === 0) {
              console.log("No previous runs found");
              return;
            } else {
              console.log("Previous successful run:", runs.data.workflow_runs[0]);
            }

            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runs.data.workflow_runs[0].id
            });

            const metadataArtifact = artifacts.data.artifacts.find(a => a.name === 'metadata.json');
            if (!metadataArtifact) {
              console.log('No previous metadata artifact found.');
              return;
            }
            console.log("Found previous metadata artifact:", metadataArtifact);
        continue-on-error: true

      - name: Check out linux source
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "Github Actions"
          git config --global --add safe.directory $(pwd)
          this_repo_commit="$(git rev-parse HEAD)"
          git clone --depth 1 --single-branch --branch '${{ steps.resolve_vars.outputs.linux_ref }}' '${{ steps.resolve_vars.outputs.linux_repo }}' linux-src
          cd linux-src
          echo '${{ toJSON(steps.resolve_vars.outputs) }}' | jq \
            --arg buildcommit "$this_repo_commit" \
            --arg linuxcommit "$(git rev-parse HEAD)" \
            '. += {"build_commit":$buildcommit,"linux_commit":$linuxcommit}' > ../metadata.json

      - name: Configure and build linux
        working-directory: linux-src
        run: |
          ../configs/${{ steps.resolve_vars.outputs.linux_config }}.sh
          make -j$(getconf _NPROCESSORS_ONLN) bindeb-pkg

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: linuxdebs
          path: "*.deb"

      - name: Upload metadata artifact
        uses: actions/upload-artifact@v7
        with:
          name: metadata.json
          path: metadata.json
          archive: false
